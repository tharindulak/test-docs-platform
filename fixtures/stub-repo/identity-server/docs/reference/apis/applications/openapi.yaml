  /applications/{applicationId}/export:
    get:
      tags:
        - Applications
      operationId: exportApplication
      summary: |
        Export application as an XML file.
      description: |
        This API provides the capability to retrieve the application as an XML file. <br>

        <b>Scope(Permission) required:</b> 
          - `internal_application_mgt_view`

        <b>➕ Additional Scopes</b>

          To export the application with the client secret, you also need the following additional scope:

          | Action | Scope |
          |---------|--------|
          | Export the client secret | `internal_application_mgt_client_secret_view` |
      parameters:
        - name: applicationId
          in: path
          description: ID of the application.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/exportSecretsQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                example: Sample application configuration xml as a string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Curl
          source: |
            curl -X 'GET' \
            'https://localhost:9443/api/server/v1/applications/{application-id}/export?exportSecrets=false' \
            -H 'accept: application/octet-stream' \
            -H 'Authorization: Basic YWRtaW46YWRtaW4='
  /applications/{applicationId}/exportFile:
    get:
      tags:
        - Applications
      operationId: exportApplicationAsFile
      summary: |
        Export application in XML, YAML, or JSON file formats.
      description: |
        This API provides the capability to retrieve the application in XML, YAML, or JSON format. <br>

        <b>Scope(Permission) required:</b> 
          - `internal_application_mgt_view`

        <b>➕ Additional Scopes</b>

          To export the application with the client secret, you also need the following additional scope:

          | Action | Scope |
          |---------|--------|
          | Export the client secret | `internal_application_mgt_client_secret_view` |
      parameters:
        - name: applicationId
