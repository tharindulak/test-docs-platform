        accessUrl:
          type: string
          example: https://example.com/login
        logoutReturnUrl:
          type: string
          example: https://example.com/app/logout
        clientId:
          type: string
          example: SmrrDNXRYf1lMmDlnleeHTuXx_Ea
        issuer:
          type: string
