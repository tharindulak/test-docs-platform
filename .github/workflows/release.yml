# Release docs: turns accepted Docs bundles into live Docs deployments
# (Releases and deployments, the release pipeline). It starts from:
#   - a push to main that changes releases/*.yaml, the intake records
#     (intake.yml's merged pull request): tag scope for each Edition's new
#     newest entry, built from its recorded bundle; a withdrawn newest entry
#     flips its Edition back to the previous entry's release folder, or
#     rebuilds that entry's bundle when the folder was collected;
#   - dispatches, for rebuilds: scope docspace (every deployed Edition of a
#     Doc space), all (a Platform release, platform-release.yml: every live
#     deployment whose Content repo pins this Platform's major) and landing
#     (the Landing deployment, from the Platform alone), each from its
#     deployed tag's recorded bundle; and scope tag for the Platform's own Doc
#     space only (Contribute's Cloud tags, platform-deployments.yml). Content
#     repos dispatch nothing: their releases reach the Platform by intake.
#   - scope theme, which publishes the shared theme alone (a theme-only
#     Platform release); scope all publishes it too (jobs theme and
#     theme-promote).
# The release sequence:
#   0   keep a copy of each bundle     (store: to _bundles/<sha256>.zip on docs-staging,
#                                       before any build; runs no content code)
#   1-2 build and blocking checks     (one matrix job per Docs deployment; it runs
#                                       bundle content and holds no storage credential)
#   3   upload the release folder      (publish: one job per deployment, which runs
#                                       no content code: immutable, to docs-staging)
#   4   flip the staging pointer       (finalize-staging: one state write; back for a withdrawal)
#   5   staging crawl gate
#   6   staging search index           (through the 141 VM's gate: upsert, then delete stale;
#                                       retries and alerts, never blocks)
#   7   promote to production          (promote: OFF for the Pilot)
#   8   production search index        (OFF for the Pilot, with promotion)
#   9   sitemap index and edge redirect table
#   10  summary for the Doc space owners
# Staging for the Pilot is the Pilot's Cloudflare account (spec/edge-and-hosting.md).
# The theme: upload to a new immutable folder on staging, point staging's
# theme at the new one and run the contrast check; when they pass, the same
# folder to production. axe runs only on demand (input a11y): with staging's
# live theme before the pointer moves, then with the new one, on one sample
# page of every live deployment of the major (light and dark, desktop and
# 375 px, with screenshots); only violations the new theme introduces block.
# No build, no crawl gate: every page links the live theme at the edge.
# PENDING INFRA (ticket 15): the staging and production environments need
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / CLOUDFLARE_API_TOKEN secrets and
# R2_ENDPOINT / CLOUDFLARE_ACCOUNT_ID / REDIRECTS_KV_ID variables. The search
# index goes through the search host's gate (hosting/vm/, the 141 VM for
# staging): DOCS_SEARCH_HOST, DOCS_SEARCH_KNOWN_HOSTS, DOCS_SEARCH_UPLOAD_KEY
# and DOCS_SEARCH_GATE_KEY secrets. The Typesense admin key never leaves it.
name: Release docs
run-name: "Release docs: ${{ github.event_name == 'push' && 'intake records' || inputs.tag || inputs.space || inputs.scope || 'all' }}"

on:
  push:
    branches: [main]
    paths: ['releases/*.yaml']
  workflow_dispatch:
    inputs:
      repo:
        description: The Platform repo (owner/name), for scope "tag" (its own Doc space, Contribute); Content repos release through intake
        type: string
        required: false
      tag:
        description: The Platform's own Docs release tag, cloud-<YYYY.MM.DD>.<n>, for scope "tag"
        type: string
        required: false
      scope:
        description: tag = the Platform's own Doc space at a tag; docspace = every Edition of a Doc space; all = every Edition whose Content repo pins this Platform's major, and the theme; landing = the Landing deployment; theme = the shared theme alone
        type: choice
        options: [tag, docspace, all, landing, theme]
        default: tag
      space:
        description: Doc space slug, for scope "docspace"
        type: string
        required: false
      a11y:
        description: For scopes theme and all, also run axe on the shared theme before promoting it (one sample page of every live deployment of the major, with screenshots)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run per record push; rebuilds and the Platform's own Cloud tags keep
  # their groups (a newer Contribute Cloud release cancels an older one).
  group: release-${{ github.event_name == 'push' && format('records-{0}', github.sha) || format('{0}-{1}', inputs.repo || 'platform', contains(inputs.tag, 'cloud-') && 'cloud' || inputs.tag || inputs.space || inputs.scope || 'all') }}
  cancel-in-progress: ${{ github.event_name != 'push' && contains(inputs.tag, 'cloud-') }}

env:
  SCOPE: ${{ github.event_name == 'push' && 'records' || inputs.scope || 'tag' }}
  STAGING_STORAGE: s3://wso2-docs-site
  PRODUCTION_STORAGE: s3://docs-prod
  STAGING_HOST: https://wso2-docs-site.tharinduj.workers.dev

jobs:
  # Runs no content code: compose reads the Doc space manifests, the plan
  # reads the intake records and the staging state.
  plan:
    # Scope theme builds nothing: only the theme jobs run.
    if: inputs.scope != 'theme'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      latest: ${{ steps.plan.outputs.latest }}
      others: ${{ steps.plan.outputs.others }}
      all: ${{ steps.plan.outputs.all }}
      has-latest: ${{ steps.plan.outputs.has-latest }}
      has-others: ${{ steps.plan.outputs.has-others }}
      flip: ${{ steps.plan.outputs.flip }}
      flip-back: ${{ steps.plan.outputs.flip-back }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pushed range, for the intake records before it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A release reaches the compose step here: the Content repos' main-line
      # Doc space manifests are composed and stored as the last good copy
      # (_platform/composed.json). A failed compose keeps the last good copy and
      # alerts its owners in the annotations; the release then plans from it, and
      # an Edition that only the new manifest adds fails the plan.
      - name: Check out the Content repos' main lines (the Doc space manifests compose reads)
        env:
          # PENDING INFRA: a read-only token while the Content repos are private.
          CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}
        run: node scripts/clone-content-repos.mjs --out "$RUNNER_TEMP/content"
      - name: Compose and store the Deployment manifest (keeps the last good copy on failure)
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node bin/wso2-release.mjs compose --content "$RUNNER_TEMP/content" --storage "$STAGING_STORAGE" --report compose-report.json
      - id: plan
        name: Plan the Docs deployments (from the stored composed manifest and the intake records)
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SPACE: ${{ inputs.space }}
          BEFORE: ${{ github.event.before }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "$SCOPE" = "records" ]; then
            args=(plan --scope records --base "$BEFORE" --records releases --storage "$STAGING_STORAGE" --rebuild-id "$GITHUB_RUN_ID")
          else
            # Content repos release through intake; a tag here is the Platform's own.
            if [ "$SCOPE" = "tag" ] && [ "${INPUT_REPO,,}" != "${GITHUB_REPOSITORY,,}" ]; then
              echo "::error::Scope tag releases only this repo's own Doc space; a Content repo's release starts from its intake record (intake.yml)"
              exit 1
            fi
            # Scope all (a Platform release) reads each Content repo's pinned
            # Platform major from the main-line checkouts above.
            args=(plan --scope "$SCOPE" --storage "$STAGING_STORAGE" --rebuild-id "$GITHUB_RUN_ID" --content "$RUNNER_TEMP/content" --records releases)
            [ -n "$INPUT_REPO" ] && args+=(--repo "$INPUT_REPO")
            [ -n "$INPUT_TAG" ] && args+=(--tag "$INPUT_TAG")
            [ -n "$INPUT_SPACE" ] && args+=(--space "$INPUT_SPACE")
          fi
          node bin/wso2-release.mjs "${args[@]}" > plan.json
          cat plan.json
          {
            echo "latest=$(jq -c .latest plan.json)"
            echo "others=$(jq -c .others plan.json)"
            echo "all=$(jq -c '{include: .deployments}' plan.json)"
            echo "has-latest=$(jq -r .hasLatest plan.json)"
            echo "has-others=$(jq -r .hasOthers plan.json)"
            echo "flip=$(jq -r .flip plan.json)"
            echo "flip-back=$(jq -r .flipBack plan.json)"
          } >> "$GITHUB_OUTPUT"
      # The bundle store's fallback (Storage and pointers): builds fetch their
      # bundle from GitHub; for one GitHub no longer serves, this job hands
      # the build the Platform's stored copy (_bundles/<sha256>.zip, sha256
      # checked against the record) as the bundle-copies artifact, so the
      # build job still holds no storage credential. Usually there is none.
      - name: Stored bundle copies for the builds GitHub no longer serves
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node bin/wso2-release.mjs bundle-copies --storage "$STAGING_STORAGE" --plan plan.json --out "$RUNNER_TEMP/bundle-copies"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-copies
          path: ${{ runner.temp }}/bundle-copies
          retention-days: 1
          if-no-files-found: ignore
      # What the builds read from staging, read here, since the build jobs
      # hold no storage credential: the stored composed manifest (docs:
      # links, latest, Cloud parts), the deployment state (the menus built
      # into each page list only deployed Doc spaces, and this one), every
      # deployed route list (docs: link checks) and each Doc space's deployed
      # latest page list (canonicals of older versions).
      - name: The builds' inputs from staging
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p inputs/latest
          node bin/wso2-release.mjs composed --storage "$STAGING_STORAGE" --out inputs/composed.json
          node bin/wso2-release.mjs status --storage "$STAGING_STORAGE" > inputs/state.json
          node bin/wso2-release.mjs route-lists --storage "$STAGING_STORAGE" --out inputs/routes
          for space in $(jq -r '[.deployments[].space] | unique | .[]' plan.json); do
            [ "$space" = "_landing" ] && continue
            node bin/wso2-release.mjs latest-pages --storage "$STAGING_STORAGE" --space "$space" --out "inputs/latest/$space.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: inputs
          retention-days: 1

  # The bundle store (Storage and pointers), before any build: each bundle the
  # plan builds from is copied to _bundles/<sha256>.zip in the staging bucket,
  # fetched from GitHub with its sha256 checked against the intake record,
  # unless it is stored already. It holds the storage credential and runs no
  # content code: bytes are only fetched, hashed and uploaded, never unpacked.
  # A failure stops the release as a failed build does.
  store:
    needs: plan
    if: needs.plan.outputs.has-latest == 'true' || needs.plan.outputs.has-others == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copy each planned bundle to the bundle store (sha256 checked against the record)
        env:
          ALL: ${{ needs.plan.outputs.all }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}
        run: |
          printf '%s' "$ALL" > "$RUNNER_TEMP/plan.json"
          node bin/wso2-release.mjs store-bundles --storage "$STAGING_STORAGE" --plan "$RUNNER_TEMP/plan.json" --work "$RUNNER_TEMP/bundles"

  # Latest twins build first: older versions take their canonicals from the
  # new latest page list.
  build-latest:
    needs: [plan, store]
    if: needs.plan.outputs.has-latest == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.latest) }}
    uses: ./.github/workflows/build-deployment.yml
    with:
      repo: ${{ matrix.repo }}
      dir: ${{ matrix.dir }}
      tag: ${{ matrix.tag }}
      release: ${{ matrix.release }}
      space: ${{ matrix.space }}
      segment: ${{ matrix.segment }}
      edition: ${{ matrix.edition }}
      as-latest: ${{ matrix.asLatest }}
      asset: ${{ matrix.asset }}
      sha256: ${{ matrix.sha256 }}
    secrets:
      CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}

  build:
    needs: [plan, store, build-latest]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.has-others == 'true'
      && needs.store.result == 'success'
      && needs.build-latest.result != 'failure' && needs.build-latest.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.others) }}
    uses: ./.github/workflows/build-deployment.yml
    with:
      repo: ${{ matrix.repo }}
      dir: ${{ matrix.dir }}
      tag: ${{ matrix.tag }}
      release: ${{ matrix.release }}
      space: ${{ matrix.space }}
      segment: ${{ matrix.segment }}
      edition: ${{ matrix.edition }}
      as-latest: ${{ matrix.asLatest }}
      asset: ${{ matrix.asset }}
      sha256: ${{ matrix.sha256 }}
    secrets:
      CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}

  # Step 3, one job per deployment once every build passed: uploads what the
  # build made to its own new release folder. It holds the storage key and
  # runs no content code (the files are only read and uploaded), so a bad
  # bundle can reach only a folder nothing points to yet.
  publish:
    needs: [plan, store, build-latest, build]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.plan.outputs.has-latest == 'true' || needs.plan.outputs.has-others == 'true')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.all) }}
    name: publish ${{ matrix.space }}/${{ matrix.segment }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.space }}-${{ matrix.segment }}
          path: ${{ runner.temp }}/release
      - name: Upload the release folder to staging (step 3)
        env:
          SPACE: ${{ matrix.space }}
          SEGMENT: ${{ matrix.segment }}
          EDITION: ${{ matrix.edition }}
          TAG: ${{ matrix.tag }}
          RELEASE: ${{ matrix.release }}
          SOURCE_REPO: ${{ matrix.repo }}
        run: |
          node bin/wso2-release.mjs publish --storage "$STAGING_STORAGE" --dir "$RUNNER_TEMP/release/build" \
            --space "$SPACE" --segment "$SEGMENT" --edition "$EDITION" --tag "$TAG" --release "$RELEASE" \
            --source-repo "$SOURCE_REPO" --source-sha "$(cat "$RUNNER_TEMP/release/source-sha")"

  # Any failed build or upload leaves the previous release live: nothing below runs.
  # Runs no content code: flips, crawls and indexes what the builds uploaded.
  finalize-staging:
    needs: [plan, store, build-latest, build, publish]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.plan.outputs.flip != '' || needs.plan.outputs.flip-back != '')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: staging
    # No concurrency group: GitHub keeps one waiting run per group and cancels
    # an older waiting one. Each state-writing command waits its turn on the
    # bucket's state lock instead (lib/state-lock.mjs).
    outputs:
      crawl-passed: ${{ steps.crawl.outcome == 'success' }}
    env:
      FLIP: ${{ needs.plan.outputs.flip }}
      FLIP_BACK: ${{ needs.plan.outputs.flip-back }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # flip, search-index and the rest read the stored composed manifest from staging.
      - name: Flip the staging pointer (step 4)
        run: |
          chrome=()
          [ -f chrome/chrome.json ] && chrome=(--chrome chrome/chrome.json)
          [ -n "$FLIP" ] && node bin/wso2-release.mjs flip --storage "$STAGING_STORAGE" --env staging --deploy "$FLIP" "${chrome[@]}"
          # A withdrawn release: back to the previous entry's release folder.
          [ -n "$FLIP_BACK" ] && node bin/wso2-release.mjs flip --storage "$STAGING_STORAGE" --env staging --deploy "$FLIP_BACK" --backwards "${chrome[@]}"
          exit 0
      - name: Staging redirect table
        run: node bin/wso2-release.mjs redirects --storage "$STAGING_STORAGE" --kv "cloudflare:${{ vars.REDIRECTS_KV_ID }}"
      - name: Staging crawl gate (step 5)
        id: crawl
        continue-on-error: true
        run: node bin/wso2-release.mjs crawl --storage "$STAGING_STORAGE" --host "$STAGING_HOST" --deploy "$FLIP $FLIP_BACK"
      # Uploads each new deployment's search files (search-export) with the
      # write-only key, then the gate key runs search-index on the 141 VM:
      # upserts _platform/search-records.json (never /latest/), then deletes
      # that Edition's stale records. Retries; a failure is a warning
      # annotation and never blocks the release.
      - name: Staging search index (step 6)
        id: search
        continue-on-error: true
        env:
          DOCS_SEARCH_HOST: ${{ secrets.DOCS_SEARCH_HOST }}
          DOCS_SEARCH_KNOWN_HOSTS: ${{ secrets.DOCS_SEARCH_KNOWN_HOSTS }}
          DOCS_SEARCH_UPLOAD_KEY: ${{ secrets.DOCS_SEARCH_UPLOAD_KEY }}
          DOCS_SEARCH_GATE_KEY: ${{ secrets.DOCS_SEARCH_GATE_KEY }}
        run: hosting/vm/search-via-gate.sh index --storage "$STAGING_STORAGE" --deploy "$FLIP $FLIP_BACK"
      - name: Keep the last 5 releases
        run: node bin/wso2-release.mjs gc --storage "$STAGING_STORAGE"
      # The bundle store's GC: copies no intake record names. It reads the
      # records on main just before (not this run's commit), so a copy stored
      # for an entry merged since this run started is kept.
      - name: Main's intake records, for the bundle store's GC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main-records
          sparse-checkout: releases
          persist-credentials: false
      - name: Keep only the bundle copies an intake record names
        run: node bin/wso2-release.mjs gc-bundles --storage "$STAGING_STORAGE" --records main-records/releases
      - name: Summary (step 10)
        env:
          CRAWL: ${{ steps.crawl.outcome }}
          SEARCH: ${{ steps.search.outcome }}
        run: |
          {
            echo "## Docs release on staging"
            echo
            echo "| Deployment | Release | Staging URL |"
            echo "|---|---|---|"
            for d in $FLIP $FLIP_BACK; do
              dep="${d%%=*}"; rel="${d#*=}"
              echo "| \`$dep\` | \`$rel\` | $STAGING_HOST/$dep/ |"
            done
            echo
            [ -n "$FLIP_BACK" ] && echo "Back after a withdrawn release: \`$FLIP_BACK\`" && echo
            echo "Staging crawl gate: **$CRAWL**"
            echo
            echo "Staging search index: **$SEARCH**"
          } >> "$GITHUB_STEP_SUMMARY"
          # Posting this to the Doc space owners waits on a channel decision.

  # Steps 7-9 in production. OFF for the Pilot (no production cutover): it runs
  # only when the repository variable DOCS_PRODUCTION_ENABLED is "true" and the
  # staging crawl gate passed. Runs no content code.
  promote:
    needs: [plan, finalize-staging]
    if: needs.finalize-staging.outputs.crawl-passed == 'true' && vars.DOCS_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # No concurrency group: GitHub keeps one waiting run per group and cancels
    # an older waiting one. Each state-writing command waits its turn on the
    # bucket's state lock instead (lib/state-lock.mjs).
    env:
      FLIP: ${{ needs.plan.outputs.flip }}
      FLIP_BACK: ${{ needs.plan.outputs.flip-back }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The composed manifest staging released with
        run: node bin/wso2-release.mjs composed --storage "$STAGING_STORAGE" --out composed.json
      - name: Copy the tested release folders to production (step 7)
        run: node bin/wso2-release.mjs promote --storage "$STAGING_STORAGE" --to "$PRODUCTION_STORAGE" --deploy "$FLIP $FLIP_BACK"
      - name: Flip the production pointer (step 7)
        run: |
          chrome=()
          [ -f chrome/chrome.json ] && chrome=(--chrome chrome/chrome.json)
          [ -n "$FLIP" ] && node bin/wso2-release.mjs flip --storage "$PRODUCTION_STORAGE" --env production --policy composed.json --deploy "$FLIP" "${chrome[@]}"
          [ -n "$FLIP_BACK" ] && node bin/wso2-release.mjs flip --storage "$PRODUCTION_STORAGE" --env production --policy composed.json --deploy "$FLIP_BACK" --backwards "${chrome[@]}"
          exit 0
      # The same gate on production's search host (PENDING INFRA: production
      # search hosting); its gate.conf names the production collection.
      - name: Production search index (step 8)
        continue-on-error: true
        env:
          DOCS_SEARCH_HOST: ${{ secrets.DOCS_SEARCH_HOST }}
          DOCS_SEARCH_KNOWN_HOSTS: ${{ secrets.DOCS_SEARCH_KNOWN_HOSTS }}
          DOCS_SEARCH_UPLOAD_KEY: ${{ secrets.DOCS_SEARCH_UPLOAD_KEY }}
          DOCS_SEARCH_GATE_KEY: ${{ secrets.DOCS_SEARCH_GATE_KEY }}
        run: hosting/vm/search-via-gate.sh index --storage "$PRODUCTION_STORAGE" --policy composed.json --deploy "$FLIP $FLIP_BACK"
      - name: Production redirect table (step 9; the flip republished the sitemap index)
        run: node bin/wso2-release.mjs redirects --storage "$PRODUCTION_STORAGE" --kv "cloudflare:${{ vars.REDIRECTS_KV_ID }}"
      - name: Keep the last 5 releases
        run: node bin/wso2-release.mjs gc --storage "$PRODUCTION_STORAGE"

  # The shared theme (scope theme, and with every rebuild of scope all): this
  # checkout's site/wso2-theme/, bundled under theme id <version>.r<run id>.
  # The contrast check always runs. axe runs only with input a11y: a theme
  # rollback is an instant pointer move, the nightly reports sample
  # production with axe, and the Platform pull request's axe check covers a
  # theme change. When it runs, it runs twice on the same pages: with
  # staging's live theme (before the pointer moves), then with the new one;
  # only what the new theme introduces blocks. The major's first theme has
  # nothing to compare with: every violation blocks.
  theme:
    if: inputs.scope == 'theme' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    environment: staging
    # No concurrency group: the pointer move waits its turn on the state lock.
    outputs:
      release: ${{ steps.publish.outputs.release }}
      major: ${{ steps.publish.outputs.major }}
      checks-passed: ${{ steps.contrast.outcome == 'success' && (steps.axe.outcome == 'success' || !inputs.a11y) }}
    env:
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out the Content repos' main lines (each one's pinned Platform major)
        if: inputs.a11y
        env:
          CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}
        run: node scripts/clone-content-repos.mjs --out "$RUNNER_TEMP/content"
      - id: publish
        name: Upload the theme to staging
        run: node bin/wso2-release.mjs theme publish --storage "$STAGING_STORAGE" --env staging --run-id "$GITHUB_RUN_ID" --upload-only --github-output "$GITHUB_OUTPUT"
      - id: pages
        name: The theme checks' pages
        if: inputs.a11y
        env:
          MAJOR: ${{ steps.publish.outputs.major }}
        run: node bin/wso2-release.mjs theme check-pages --storage "$STAGING_STORAGE" --host "$STAGING_HOST" --major "$MAJOR" --content "$RUNNER_TEMP/content" --screenshots screenshots --out pa11y.json --baseline-out pa11y-live.json --github-output "$GITHUB_OUTPUT"
      - name: axe with the live theme (the baseline)
        if: inputs.a11y && steps.pages.outputs.live != ''
        run: npx --yes pa11y-ci@5.0.0 --config pa11y-live.json --json > a11y-live.json || true
      - name: Point staging's theme at the new one
        env:
          MAJOR: ${{ steps.publish.outputs.major }}
          RELEASE: ${{ steps.publish.outputs.release }}
        run: node bin/wso2-release.mjs theme publish --storage "$STAGING_STORAGE" --env staging --release "$RELEASE" --major "$MAJOR"
      # The Worker keeps its manifest copy 30 s per isolate.
      - name: Wait until the staging edge serves the new theme
        env:
          MAJOR: ${{ steps.publish.outputs.major }}
          RELEASE: ${{ steps.publish.outputs.release }}
        run: |
          for _ in $(seq 1 36); do
            got=$(curl -fsSI "$STAGING_HOST/_platform/theme/v$MAJOR/theme.css" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-docs-theme" {print $2}' || true)
            if [ "$got" = "v$MAJOR/$RELEASE" ]; then sleep 30; exit 0; fi
            sleep 5
          done
          echo "::error::$STAGING_HOST still serves theme ${got:-none}, not v$MAJOR/$RELEASE"
          exit 1
      - name: Contrast check of the theme's colour pairs
        id: contrast
        continue-on-error: true
        run: npm test -- test/contrast.test.mjs
      - name: axe with the new theme (light and dark, desktop and 375 px, screenshots)
        if: inputs.a11y
        run: npx --yes pa11y-ci@5.0.0 --config pa11y.json --json > a11y.json || true
      - name: Block only on violations the new theme introduces
        id: axe
        if: inputs.a11y
        continue-on-error: true
        env:
          LIVE: ${{ steps.pages.outputs.live }}
        run: |
          args=(theme compare --new a11y.json --summary axe-summary.md)
          [ -n "$LIVE" ] && args+=(--old a11y-live.json)
          node bin/wso2-release.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.a11y
        with:
          name: theme-checks-${{ steps.publish.outputs.release }}
          path: |
            screenshots/
            a11y.json
            a11y-live.json
            pa11y.json
          retention-days: 30
      - name: Summary
        if: always()
        env:
          RELEASE: ${{ steps.publish.outputs.release }}
          MAJOR: ${{ steps.publish.outputs.major }}
          LIVE: ${{ steps.pages.outputs.live }}
          A11Y: ${{ inputs.a11y }}
          AXE: ${{ steps.axe.outcome }}
          CONTRAST: ${{ steps.contrast.outcome }}
        run: |
          {
            echo "## Theme v$MAJOR/$RELEASE on staging"
            echo
            if [ "$A11Y" = "true" ]; then
              echo "Compared with: ${LIVE:-nothing (the first theme of this major)}"
              echo
              echo "Contrast check: **$CONTRAST**; axe gate: **$AXE**"
              echo
              cat axe-summary.md 2>/dev/null || echo "axe did not report"
              echo
              echo "Screenshots of the new theme are in the run's theme-checks artifact."
            else
              echo "Contrast check: **$CONTRAST**; axe: **skipped** (input \`a11y\` off)"
              echo
              echo "To run axe on the theme (one sample page of every live deployment of the major, against the live theme, with screenshots),"
              echo "run Release docs by hand with scope \`theme\` and \`a11y\` on, which publishes the theme again under a new theme id:"
              echo "\`gh workflow run release.yml --ref $GITHUB_REF_NAME -f scope=theme -f a11y=true\`"
            fi
            echo
            echo "A failed check leaves production as it is;"
            echo "staging keeps the new theme until \`wso2-release theme rollback --env staging\` (or Roll back docs, target theme)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Promotion, as a Docs release is promoted: the folder staging tested,
  # copied byte for byte, then production's theme pointer, under its state
  # lock. OFF for the Pilot with the rest of production.
  theme-promote:
    needs: theme
    if: needs.theme.outputs.checks-passed == 'true' && vars.DOCS_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE: ${{ needs.theme.outputs.release }}
      MAJOR: ${{ needs.theme.outputs.major }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The composed manifest staging released with
        run: node bin/wso2-release.mjs composed --storage "$STAGING_STORAGE" --out composed.json
      - name: Copy the tested theme to production and point production's theme at it
        run: node bin/wso2-release.mjs theme publish --storage "$PRODUCTION_STORAGE" --from "$STAGING_STORAGE" --env production --policy composed.json --release "$RELEASE" --major "$MAJOR"
