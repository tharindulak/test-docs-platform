# One Docs deployment: build, blocking checks and upload to its immutable
# release folder on staging (release sequence steps 1-3). Called by
# release.yml once per matrix entry; not triggered on its own. The Landing
# deployment (space _landing) is built from this Platform checkout alone:
# no Content repo, no latest page list, no content checks.
name: Build one Docs deployment

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      # The Doc space's directory in the Content repo (<slug>, from the plan).
      dir:
        type: string
        required: true
      tag:
        type: string
        required: true
      release:
        type: string
        required: true
      space:
        type: string
        required: true
      segment:
        type: string
        required: true
      edition:
        type: string
        required: true
      as-latest:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.space }}/${{ inputs.segment }}
    # Stage 1 runners; stages 2 and 3 (larger runners, self-hosted build
    # servers) are a change of DOCS_BUILD_RUNNER, not of this workflow.
    runs-on: ${{ vars.DOCS_BUILD_RUNNER || 'ubuntu-latest' }}
    environment: staging
    timeout-minutes: 60
    env:
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SPACE: ${{ inputs.space }}
      DIR: ${{ inputs.dir }}
      SEGMENT: ${{ inputs.segment }}
      EDITION: ${{ inputs.edition }}
      TAG: ${{ inputs.tag }}
      RELEASE: ${{ inputs.release }}
      NODE_OPTIONS: --max-old-space-size=6144
      LANDING: ${{ inputs.space == '_landing' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Content repo at the tag
        if: inputs.space != '_landing'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.tag }}
          path: content
          # Needed only while the Pilot Content repos are private.
          token: ${{ secrets.CONTENT_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build reads the Deployment manifest the plan used: the last good
      # copy compose stored in staging (docs: links, latest, Cloud parts).
      - name: The stored composed manifest
        run: node bin/wso2-release.mjs composed --storage s3://docs-staging --out "$RUNNER_TEMP/composed.json"
      # The menus built into each page list only deployed Doc spaces (and this
      # one), as the live manifest's do, so the crawl gate passes while a merged
      # Doc space waits for its first Docs release.
      - name: The staging deployment state
        run: node bin/wso2-release.mjs status --storage s3://docs-staging > "$RUNNER_TEMP/state.json"
      # Per Platform commit: Docusaurus's persistent webpack cache does not see
      # changes to the Platform's own plugins and theme, so a Platform release
      # (or any Platform change) starts every deployment's cache afresh.
      - name: Docusaurus caches for this deployment
        uses: actions/cache@v4
        with:
          path: |
            site/.docusaurus
            node_modules/.cache
          key: docusaurus-${{ inputs.space }}-${{ inputs.segment }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}-${{ inputs.tag }}
          restore-keys: docusaurus-${{ inputs.space }}-${{ inputs.segment }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}-

      # Canonicals of older versions need the latest twin's page list: from this
      # run when it rebuilt latest, else from what staging serves now.
      - name: Latest page list from this run
        if: ${{ !inputs.as-latest && inputs.space != '_landing' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: latest-pages-${{ inputs.space }}
          path: latest
      - name: Latest page list from staging
        if: ${{ !inputs.as-latest && inputs.space != '_landing' }}
        run: |
          [ -f latest/pages.json ] || node bin/wso2-release.mjs latest-pages --storage s3://docs-staging --space "$SPACE" --out latest/pages.json

      - name: Build (step 1)
        env:
          AS_LATEST: ${{ inputs.as-latest }}
          # Scoped search-only keys (public); the browser picks one by host.
          WSO2_DOCS_SEARCH_KEY_STAGING: ${{ vars.SEARCH_KEY_STAGING }}
          WSO2_DOCS_SEARCH_KEY_PRODUCTION: ${{ vars.SEARCH_KEY_PRODUCTION }}
        run: |
          # Release builds carry the production analytics head script; it runs only
          # on the production host, so the same bytes stay quiet on staging.
          # Only the Doc space's own directory builds; a family Cloud also reads
          # its Cloud parts' directories beside it, from this same checkout.
          args=(build "content/$DIR" --edition "$EDITION" --env production --manifest "$RUNNER_TEMP/composed.json" --deployed "$RUNNER_TEMP/state.json" --out build)
          [ "$LANDING" = "true" ] && args=(build --landing --env production --manifest "$RUNNER_TEMP/composed.json" --deployed "$RUNNER_TEMP/state.json" --out build)
          [ "$AS_LATEST" = "true" ] && args+=(--as-latest)
          [ -f latest/pages.json ] && args+=(--latest-pages latest/pages.json)
          start=$(date +%s)
          node bin/wso2-docs.mjs "${args[@]}"
          echo "Built $SPACE/$SEGMENT in $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Route lists of the deployed Editions, for docs links
        run: node bin/wso2-release.mjs route-lists --storage s3://docs-staging --policy "$RUNNER_TEMP/composed.json" --out routes
      # The PR's blocking checks again, on this build (Quality gates): compile,
      # docs: links against what staging serves (a target not deployed yet only
      # warns; the staging crawl gate catches it), front matter, markers,
      # skeleton, OpenAPI specs and Markdown twins. Policy checks (redirect
      # coverage, image size, marker versions) and lint ran on the PR.
      - name: Blocking checks (step 2)
        run: |
          node bin/wso2-release.mjs check --dir build --space "$SPACE" --segment "$SEGMENT" --edition "$EDITION"
          [ "$LANDING" = "true" ] && exit 0
          node bin/wso2-docs.mjs check "content/$DIR" --release --edition "$EDITION" --manifest "$RUNNER_TEMP/composed.json" --build-dir build --routes routes --out check.json
      - name: Share the latest page list with the other builds
        if: ${{ inputs.as-latest }}
        uses: actions/upload-artifact@v4
        with:
          name: latest-pages-${{ inputs.space }}
          path: build/_platform/pages.json
          retention-days: 1
      - name: Upload the release folder to staging (step 3)
        env:
          SOURCE_REPO: ${{ inputs.repo }}
        run: |
          node bin/wso2-release.mjs publish --storage s3://docs-staging --dir build \
            --space "$SPACE" --segment "$SEGMENT" --edition "$EDITION" --tag "$TAG" --release "$RELEASE" \
            --source-repo "$SOURCE_REPO" --source-sha "$([ "$LANDING" = "true" ] && echo "$GITHUB_SHA" || git -C content rev-parse HEAD)"
