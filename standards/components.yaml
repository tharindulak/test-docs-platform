# The Platform component catalogue (Extension points for product teams,
# decision 1): every MDX component and Page layout WSO2 Docs pages can use.
# It generates the Contribute page reference/components/ (npm run standards),
# and test/extensions.test.mjs checks it against site/src/theme/MDXComponents.js,
# lib/markdown-forms.mjs and the layout list (lib/layouts.mjs).
#
# To join, a component or layout needs a generic name (no product's), a
# Markdown form (its Markdown twin), an accessibility check, an entry here
# (which is its page in the Contribute Doc space) and an owner. Propose one
# with the extension proposal issue form, then a pull request to the Platform.
#
#   name          the MDX name (components) or the `layout` value (layouts)
#   use           how a page gets it: written (by writers), generated (by a
#                 Platform step from Markdown, front matter or a data file),
#                 or migration (written by the converter)
#   what          what it is for
#   example       MDX or front matter, for written components and layouts
#   markdownForm  what its Markdown twin holds (lib/markdown-forms.mjs)
#   accessibility what makes it accessible, and what checks it
#   owner         the team that keeps it
#   since         the Platform version or ticket it came with
#   imports       the module ids a page may import it from, for components
#                 that need an import (Platform components need none); the
#                 content-safety check accepts imports from these ids only
proposal: https://github.com/wso2/docs-platform/issues/new?template=extension-proposal.yml
components:
  - name: Edition
    use: written
    what: Limits a block or a phrase to some Editions (an Edition marker). The build removes what the Edition does not show; previews outline it.
    example: '<Edition only="self-hosted">Restart the server.</Edition>'
    markdownForm: The content, when the Edition shows it; nothing otherwise.
    accessibility: Adds no markup to a published page. In previews (EditionMarker) the label is text, not colour alone.
    owner: docs-platform
    since: first map (Edition markers)
  - name: Variants
    use: written
    what: "An Edition variant: one block written once for Cloud and once for Self-hosted, as exactly one `<Edition only=\"cloud\">` and one `<Edition only=\"self-hosted\">`. Each Edition, Cloud included, shows only its own form. Without it, Cloud would also show the Self-hosted form, as a Self-hosted addition."
    example: |
      <Variants>
      <Edition only="cloud">
      Open the Console.
      </Edition>
      <Edition only="self-hosted">
      Open the Management Console at `https://localhost:9443/console`.
      </Edition>
      </Variants>
    markdownForm: The Edition's own form only; nothing marks the other.
    accessibility: Adds no markup to a published page. In previews each form is outlined and labelled as an Edition variant (EditionMarker).
    owner: docs-platform
    since: Cloud Edition content
  - name: SelfHostedAddition
    use: generated
    what: "A Self-hosted addition shown in Cloud: Self-hosted-only content (an `<Edition only=\"self-hosted\">` block or phrase, or an `editions: self-hosted` page) with no Cloud counterpart. Labelled \"Self-hosted\", with a link \"See it in\" the newest release (such as Identity Server 7.3.0) to the same page under `/latest/`: a box around a block, a badge under a page's title."
    markdownForm: "A `**Self-hosted only.**` line before the block, or under the page's title; `**Self-hosted only:**` in front of a phrase. The page's llms.txt entry starts with `**Self-hosted only.**`."
    accessibility: The label is text ("Self-hosted"), never colour alone; a block is a labelled section (aria-label "Self-hosted only"), and the link names the release it opens.
    owner: docs-platform
    since: Cloud Edition content
  - name: Anchor
    use: migration
    what: A link target that is not a heading, for migrated `<a name>` anchors. Links to it are checked like links to headings.
    example: '<Anchor id="configure-the-keystore" />'
    markdownForm: Nothing (the target has no text).
    accessibility: An empty span with an id; nothing to read or focus.
    owner: docs-platform
    since: first map (MkDocs migration)
  - name: DocsLink
    use: generated
    what: A link to another Docs deployment, made from a `docs:<space>/<edition>/<page>` Markdown link. It opens as a full page load in the same tab.
    markdownForm: A Markdown link to the target page's address.
    accessibility: A plain link with its own text; it never opens a new tab.
    owner: docs-platform
    since: first map (docs links)
  - name: a (FileLink)
    use: generated
    what: Every link in page content. Links to files the build emits keep their address (no trailing slash added).
    markdownForm: A Markdown link.
    accessibility: The theme's link, unchanged.
    owner: docs-platform
    since: first map (API reference rendering)
  - name: EditionMarker
    use: generated
    what: Previews only (show-markers mode). Outlines a marked block and labels it, for the Edition toggle.
    markdownForm: The content in the Edition it is active in (twins are exported without markers).
    accessibility: The label is text, and inactive blocks are faded but still readable.
    owner: docs-platform
    since: first map (Edition markers)
  - name: PageActions
    use: generated
    what: The "Copy page" menu next to the title (copy or view the Markdown twin, open it in an AI assistant).
    markdownForm: Nothing (it is the twin's own menu).
    accessibility: A button with a menu, keyboard operable, with its state announced (aria-expanded).
    owner: docs-platform
    since: first map (AI/LLM-friendly docs)
  - name: ApiReference, ApiNav, ApiContent, ApiHeader, ApiTag, ApiOperation, ApiOperationMain, ApiSamples, ApiMethod, ApiEndpoint, ApiDetails, ApiSchema, ApiCode
    use: generated
    what: The parts of an API reference page, generated from its OpenAPI spec by the api-reference layout.
    markdownForm: None of their own; an API page's twin lists the operations from the spec (lib/api-twin.mjs).
    accessibility: Method badges meet WCAG 2.2 AA in both themes (test/api-reference.test.mjs); headings per tag and operation; schemas in native details elements.
    owner: docs-platform
    since: first map (API reference rendering)
  - name: OverviewGrid, OverviewCard
    use: generated
    what: The cards of the overview layout, drawn from the page's own sections.
    markdownForm: The sections as written (the twin is the page's Markdown).
    accessibility: Each card is a section headed by the page's own heading, so the outline, anchors and TOC data stay as written; card text uses the chrome's checked colour pairs (test/contrast.test.mjs).
    owner: docs-platform
    since: Extension points in the Platform
  - name: Catalog, CatalogItem, CatalogLogo
    use: generated
    what: The searchable grid of the catalog layout, drawn from the page's data file.
    markdownForm: A list of the items shown in the Edition, each with its name linked, its status, its description and its other links. Logos are left out.
    accessibility: Every item is in the server-rendered list; the search box has a label, the filter chips are buttons with aria-pressed in a labelled group, the result count is announced (role="status"), hidden items leave the reading order, and logos are decorative (alt="", the name is text). Checked by test/build.test.mjs and the nightly axe run.
    owner: docs-platform
    since: Extension points in the Platform
  - name: Tabs, TabItem, Details, Admonition, CodeBlock, Mermaid, DocCardList, ThemedImage, Head, TOCInline
    use: written
    what: The Docusaurus theme components WSO2 content uses (admonitions are usually written with `:::note`).
    markdownForm: "Tabs become labelled sub-sections, Details is expanded, admonitions become `> **Note:**`, code stays code, DocCardList lists the folder's pages, ThemedImage keeps the light image, Head and TOCInline leave nothing."
    accessibility: The Docusaurus theme's own (keyboard tabs, native details).
    owner: docs-platform
    since: first map (Docusaurus theme)
    imports: ['@theme/Tabs', '@theme/TabItem', '@theme/Details', '@theme/Admonition', '@theme/CodeBlock', '@theme/Mermaid', '@theme/DocCardList', '@theme/ThemedImage', '@docusaurus/Head', '@theme/TOCInline']
layouts:
  - name: default
    what: The page as written. Every page has it unless it says otherwise.
    example: 'layout: default'
    data: none
    markdownForm: The page.
    accessibility: The theme's article, TOC and sidebar.
    owner: docs-platform
    since: first map
  - name: overview
    what: "A page of cards that link to components or sections: family-level homes, product homes, guide indexes. Every H2 or H3 section that holds only text and links, with a list or a paragraph that is one link, becomes a card; cards in a row share a grid, and text after a card's links labels the next row. Everything else stays prose, and the page has no TOC column."
    example: |
      layout: overview
      ---
      ## Get started
      - [Create an account](./get-started/create-an-account.mdx)
      - [Connect a React app](./get-started/react.mdx)
    data: none (the page's own Markdown)
    markdownForm: The page as written.
    accessibility: Cards are sections headed by the page's headings; see OverviewCard.
    owner: docs-platform
    since: Extension points in the Platform
  - name: catalog
    what: "The page's text, then a searchable, filterable grid of the items in its data file, such as connectors.yaml: each with a logo, its name linked to its page, a description and more links. Items can be limited to Editions, and the page has no TOC column."
    example: |
      layout: catalog
      data: ./connectors.yaml
    data: "catalog (schemas/catalog.schema.json): categories (the filter chips) and items (id, name, description, href, links, category, tags, logo, status, editions)"
    markdownForm: The page's text, then the items as a list; see Catalog.
    accessibility: See Catalog.
    owner: docs-platform
    since: Extension points in the Platform
  - name: api-reference
    what: An API reference page rendered from its OpenAPI spec, with its own navigation, operations and samples.
    example: |
      layout: api-reference
      spec: ./openapi.yaml
    data: the OpenAPI spec (synced from the product repository by the spec-sync workflow)
    markdownForm: The overview, then the operations from the spec.
    accessibility: See the API components.
    owner: docs-platform
    since: first map (API reference rendering)
  - name: complete-guide, sdk, connector
    what: The migration's page templates, drawn as default. A folder of complete-guide pages is also exported as one Markdown file.
    example: 'layout: complete-guide'
    data: none
    markdownForm: The page (a complete guide also joins its folder's single export).
    accessibility: As default.
    owner: docs-platform
    since: first map (MkDocs migration)
dataFiles:
  - kind: catalog
    schema: schemas/catalog.schema.json
    found: named by a catalog page's `data:` front matter
  - kind: release-notes
    schema: schemas/release-notes.schema.json
    found: "by name: release-notes.yaml (or .yml, .json) anywhere in docs/"
  - kind: sdks
    schema: schemas/sdks.schema.json
    found: "by name: sdks.yaml (or .yml, .json) anywhere in docs/"
